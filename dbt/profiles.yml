deliveryiq:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      # Base dataset; dbt appends each model's +schema (bronze/silver/gold),
      # yielding deliveryiq_bronze / deliveryiq_silver / deliveryiq_gold.
      dataset: "{{ env_var('DBT_DATASET', 'deliveryiq') }}"
      location: asia-south1
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 4
      timeout_seconds: 300
      job_labels:
        project: deliveryiq
        environment: "{{ env_var('DBT_TARGET', 'dev') }}"
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: deliveryiq
      location: asia-south1
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 8
    # Local developer target — authenticates with the gcloud user login via
    # Application Default Credentials (run `gcloud auth application-default login`
    # once). No service-account key file required.
    local_oauth:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_GCP_PROJECT_ID', 'delivery-iq-499207') }}"
      dataset: "{{ env_var('DBT_DATASET', 'deliveryiq') }}"
      location: asia-south1
      threads: 4
      timeout_seconds: 300
